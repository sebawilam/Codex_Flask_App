<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Link</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
    <main class="mx-auto w-full max-w-[600px] px-4 py-12 sm:px-6">
      <nav class="mb-8 text-sm"><a class="text-sky-700 underline-offset-4 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sky-600" href="{{ url_for('index') }}">Back to My Links</a></nav>
      <h1 class="mb-6 text-3xl font-bold tracking-tight text-slate-900">Edit Link</h1>
      <form class="space-y-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm" action="{{ url_for('edit_link', link_index=link_index) }}" method="post">
        <div>
          <label class="mb-1.5 block text-sm font-medium" for="name">Site name</label>
          <input class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 focus:border-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-200" type="text" id="name" name="name" value="{{ name }}" required>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium" for="url">URL</label>
          <input class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 focus:border-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-200" type="url" id="url" name="url" value="{{ url }}" required>
        </div>
        <button class="w-full rounded-lg bg-sky-700 px-4 py-2.5 font-semibold text-white transition-colors hover:bg-sky-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600" type="submit">Save Changes</button>
        <a class="block text-center text-sm text-sky-700 underline-offset-4 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sky-600" href="{{ url_for('index') }}">Cancel</a>
      </form>
    </main>
  </body>
</html>
