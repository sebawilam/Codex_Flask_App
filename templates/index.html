<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Links</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
    <main class="mx-auto w-full max-w-[600px] px-4 py-12 sm:px-6">
      <nav class="mb-8 text-sm"><a class="text-sky-700 underline-offset-4 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sky-600" href="{{ url_for('about') }}">About</a></nav>
      <h1 class="mb-6 text-3xl font-bold tracking-tight text-slate-900">My Links</h1>
      <form class="mb-8 space-y-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm" action="{{ url_for('add_link') }}" method="post">
        <div>
          <label class="mb-1.5 block text-sm font-medium" for="name">Site name</label>
          <input class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 placeholder:text-slate-400 focus:border-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-200" type="text" id="name" name="name" placeholder="My favorite site" required>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium" for="url">URL</label>
          <input class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 placeholder:text-slate-400 focus:border-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-200" type="url" id="url" name="url" placeholder="https://example.com" required>
        </div>
        <button class="w-full rounded-lg bg-sky-700 px-4 py-2.5 font-semibold text-white transition-colors hover:bg-sky-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600" type="submit">Add Link</button>
      </form>
      <ul class="space-y-3">
        {% for name, url in links %}
        <li class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <a class="min-w-0 flex-1 break-words rounded-lg font-medium text-sky-800 underline-offset-4 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600" href="{{ url }}">{{ name }}</a>
          <a class="shrink-0 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm font-medium text-sky-800 transition-colors hover:bg-sky-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600" href="{{ url_for('edit_link', link_index=loop.index0) }}" aria-label="Edit {{ name }}">Edit</a>
          <form class="shrink-0" action="{{ url_for('delete_link', link_index=loop.index0) }}" method="post">
            <button class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm font-medium text-rose-700 transition-colors hover:bg-rose-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-600" type="submit" aria-label="Delete {{ name }}">Delete</button>
          </form>
        </li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
